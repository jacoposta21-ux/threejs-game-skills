<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#1b1f3b" />
    <meta name="description" content="Pick a Marble — build crazy marble tracks, pick your champion and watch physics-driven marble races." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23ff5d8f'/%3E%3Ccircle cx='24' cy='22' r='8' fill='%23fff' opacity='.8'/%3E%3C/svg%3E" />
    <title>Pick a Marble</title>
  </head>
  <body>
    <main id="app">
      <canvas id="game-canvas" aria-label="Pick a Marble 3D view"></canvas>
      <div id="ui">
        <div id="labels"></div>
        <div id="screen"></div>
        <div id="editor-hud" hidden></div>
        <div id="race-hud" hidden></div>
        <div id="countdown"></div>
        <div id="tutorial" hidden></div>
        <div id="modal" hidden></div>
        <div id="toasts"></div>
        <div id="fps" hidden></div>
        <div id="loading">
          <div class="load-box">
            <h1 class="logo small"><span class="l1">PICK</span><span class="l2">A</span><span class="l3">MARBLE</span></h1>
            <div class="load-balls"><i></i><i></i><i></i><i></i></div>
            <div class="load-bar"><div class="load-fill"></div></div>
            <p class="load-text">Loading…</p>
          </div>
        </div>
        <div id="rotate-hint"><div>Rotate your device to landscape for the best experience</div></div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

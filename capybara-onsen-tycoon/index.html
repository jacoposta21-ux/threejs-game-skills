<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Capybara Onsen Tycoon</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f3dfc0; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      #game { position: fixed; inset: 0; }
      #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: radial-gradient(circle at 50% 40%, #fff6e6, #f3dfc0); font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif; color: #5a3a26; z-index: 10; transition: opacity .4s; }
      #loader.done { opacity: 0; pointer-events: none; }
      #loader h1 { margin: 0; font-size: clamp(22px, 5vw, 44px); }
      #loader .steam { font-size: clamp(40px, 9vw, 72px); animation: bob 1.2s ease-in-out infinite; }
      #loader .bar { width: min(60vw, 320px); height: 14px; border-radius: 7px; background: #e6cfa8; overflow: hidden; }
      #loader .bar i { display: block; height: 100%; width: 40%; border-radius: 7px; background: #7fae7a; animation: load 1.1s ease-in-out infinite; }
      @keyframes bob { 50% { transform: translateY(-8px); } }
      @keyframes load { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
      .stub-ad { position: fixed; inset: 0; z-index: 100; background: rgba(20, 14, 10, .85); display: flex; align-items: center; justify-content: center; font-family: "Trebuchet MS", Arial, sans-serif; }
      .stub-ad-box { background: #222; color: #fff; border: 3px dashed #ffd36b; border-radius: 16px; padding: 28px 40px; text-align: center; }
      .stub-ad-title { font-size: 22px; margin-bottom: 10px; }
      .stub-ad-count { font-size: 40px; font-weight: bold; color: #ffd36b; }
    </style>
  </head>
  <body>
    <div id="loader"><div class="steam">♨</div><h1>Capybara Onsen Tycoon</h1><div class="bar"><i></i></div><div>Heating the springs…</div></div>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
